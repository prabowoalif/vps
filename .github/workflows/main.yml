name: RDP_TIPSUNIX

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    # Use a self-hosted Windows runner that you control
    runs-on: [self-hosted, windows]
    timeout-minutes: 120

    env:
      # Put your Tailscale auth key in repository Secrets -> Actions
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          # (Optional) Disable NLA - use with caution
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' -Value 0 -Force

          # Firewall: ensure rule for RDP port exists
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null || Write-Host 'no previous rule'
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create temporary RDP user
        shell: pwsh
        run: |
          # Generate a random password (16 chars)
          $chars = (48..57) + (65..90) + (97..122) + (33..47) + (58..64)
          $password = -join (Get-Random -InputObject $chars -Count 16 | ForEach-Object {[char]$_})
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name 'rdp-user' -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name 'rdp-user' -Password $securePass -FullName 'RDP User' -Description 'Temporary RDP user'
            Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'rdp-user'
            # Add to Administrators only if necessary
            # Add-LocalGroupMember -Group 'Administrators' -Member 'rdp-user'
          } else {
            Write-Host 'User rdp-user already exists'
          }

          Add-Content -Path $env:GITHUB_ENV -Value "RDP_USER=rdp-user"
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_PASS=$password"

          if (-not (Get-LocalUser -Name 'rdp-user')) { Write-Error 'Failed to create user'; exit 1 }

      - name: Install Tailscale (if not present)
        shell: pwsh
        run: |
          $exe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          if (-not (Test-Path $exe)) {
            $msi = Join-Path $env:TEMP 'tailscale.msi'
            Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -OutFile $msi
            Start-Process -FilePath 'msiexec.exe' -ArgumentList '/i', $msi, '/quiet', '/norestart' -Wait
            Remove-Item $msi -Force
          } else { Write-Host 'Tailscale already installed' }

      - name: Start Tailscale and get IP
        shell: pwsh
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) { Write-Error 'TAILSCALE_AUTH_KEY not set'; exit 1 }
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="selfhost-$(hostname)"

          $tsIP = $null
          for ($i=0; $i -lt 10 -and -not $tsIP; $i++) {
            $raw = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4) 2>$null
            if ($raw) { $tsIP = ($raw -join ',').Trim() }
            Start-Sleep -Seconds 3
          }
          if (-not $tsIP) { Write-Error 'No Tailscale IP assigned'; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"

      - name: Verify RDP reachability
        shell: pwsh
        run: |
          Write-Host "Testing RDP connectivity to $env:TAILSCALE_IP:3389"
          $res = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $res.TcpTestSucceeded) { Write-Error 'RDP not reachable'; exit 1 }
          Write-Host 'RDP reachable'

      - name: Output connection info (short-lived)
        shell: pwsh
        run: |
          Write-Host '=== RDP ACCESS (TEMP) ==='
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: (stored in RDP_PASS for this job only)"
          Write-Host '=========================='
          Start-Sleep -Seconds 20

      - name: Cleanup (always)
        if: always()
        shell: pwsh
        run: |
          Write-Host 'Cleanup: stopping tailscale and removing rule and user'
          try { & "$env:ProgramFiles\Tailscale\tailscale.exe" down } catch {}
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null || Write-Host 'no rule'
          if (Get-LocalUser -Name 'rdp-user' -ErrorAction SilentlyContinue) { Remove-LocalUser -Name 'rdp-user' -ErrorAction SilentlyContinue }
